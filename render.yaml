services:
  - type: web
    name: associa-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: Associa Cloud API
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: verify-full
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: PG_POOL_MAX
        value: 5
      - key: PG_IDLE_TIMEOUT_MS
        value: 30000
      - key: PG_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
